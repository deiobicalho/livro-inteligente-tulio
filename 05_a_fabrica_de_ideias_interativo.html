const intros=['Olá! Eu sou o BIP. Hoje você e Túlio vão criar uma história com a imaginação!','Criatividade é inventar, combinar ideias e experimentar novas possibilidades. A IA pode ajudar, mas você é o autor das escolhas!','Primeiro, escolha o personagem principal da sua história.','Agora, escolha onde a aventura vai acontecer.','Toda aventura precisa de um desafio. Qual será o seu?','Veja a história que você criou! As escolhas mudam a aventura.','Desafio 1! Vamos pensar em personagens criativos.','Desafio 2! Vamos praticar perguntas claras para inventar histórias.','Desafio 3! Descubra outras formas de criar com a ajuda da IA.'];
function storyText(){const [c,s,d]=selected;const ch=data.choices[0][c??0],place=data.choices[1][s??0],challenge=data.choices[2][d??0];const beginnings=['Uma astronauta curiosa','Um explorador corajoso','Uma heroína inventiva','Um robô gentil'];const locations=['entre estrelas brilhantes e planetas misteriosos','em uma floresta encantada cheia de árvores luminosas','em uma cidade do futuro com jardins suspensos','no fundo do mar, entre corais coloridos'];const problems=['um dragão que guardava a passagem para um lugar secreto','um tesouro perdido que ninguém conseguia localizar','um mistério cheio de pistas e perguntas'];const plans=['Ela observou as pistas, desenhou um mapa e fez uma pergunta inteligente.','Ele conversou com novos amigos, reuniu pistas e criou um plano.','Ela usou a imaginação, ouviu ideias diferentes e encontrou uma solução.','Ele fez perguntas, comparou possibilidades e inventou uma ferramenta útil.'];const ends=['O dragão, que parecia assustador, só precisava de ajuda. Juntos, encontraram uma solução amigável.','O verdadeiro tesouro era uma caixa de invenções e ideias que todos poderiam compartilhar.','Ao investigar com atenção, descobriu a resposta e explicou o que tinha aprendido.'];return `${beginnings[c??0]} iniciou uma aventura ${locations[s??0]}.\n\nNo caminho, encontrou ${problems[d??0]}.\n\n${plans[c??0]}\n\n${ends[d??0]}\n\nNo final, percebeu que as melhores aventuras nascem da curiosidade, da colaboração e de boas ideias!`}
function speak(t){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.88;u.pitch=1.1;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('pt'));if(voices.length)u.voice=voices.find(v=>/pt-br|brazil|brasil/i.test(v.lang+' '+v.name))||voices[0];speechSynthesis.speak(u)}
function textNow(){return intros[current]+(current===5?' '+storyText():'')}
function render(){if('speechSynthesis'in window)speechSynthesis.cancel();$('picture').src=data.imgs[current];$('counter').textContent=`Cena ${current+1} de 9`;$('dialog').textContent=intros[current];$('feedback').textContent='';$('selection').replaceChildren();$('story').hidden=true;$('story').replaceChildren();$('back').disabled=current===0;$('next').textContent=current===8?'Jogar novamente ↻':current===0?'Começar →':'Próxima cena →';$('next').disabled=false;
if(current>=2&&current<=4){let k=current-2;let strong=document.createElement('strong');strong.textContent=['Escolha seu personagem:','Escolha o cenário:','Escolha o desafio:'][k];$('selection').append(strong);data.choices[k].forEach((t,i)=>{let b=document.createElement('button');b.className='answer'+(selected[k]===i?' selected':'');b.textContent=['A','B','C','D'][i]+'. '+t;b.onclick=()=>{selected[k]=i;render();$('feedback').textContent='✨ Sua escolha: '+t;speak('Você escolheu '+t)};$('selection').append(b)});$('next').disabled=selected[k]===null; if(selected[k]===null)$('feedback').textContent='Escolha uma opção para continuar.'}
if(current===5){let s=document.createElement('div');s.className='story';s.textContent=storyText();$('story').append(s);$('story').hidden=false;let b=document.createElement('button');b.className='blue';b.style.marginTop='12px';b.textContent='📋 Copiar minha história';b.onclick=()=>{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(storyText()).then(()=>$('feedback').textContent='História copiada!').catch(()=>$('feedback').textContent='Selecione o texto para copiar.')}else $('feedback').textContent='Selecione o texto para copiar.'};$('story').append(b)}
if(current>=6){let q=current-6,item=data.quizzes[q],strong=document.createElement('strong');strong.textContent=item.q;$('selection').append(strong);item.a.forEach((t,i)=>{let b=document.createElement('button');b.className='answer'+(solved[q]&&i===item.right?' correct':'');b.textContent=['A','B','C'][i]+'. '+t;b.disabled=!!solved[q];b.onclick=()=>answer(q,i);$('selection').append(b)});$('next').disabled=!solved[q];$('feedback').textContent=solved[q]?'⭐ '+item.why:'Escolha uma alternativa para continuar.'}
if(auto)speak(textNow())}
function answer(q,i){let item=data.quizzes[q],buttons=[...$('selection').querySelectorAll('button')];if(i===item.right){solved[q]=true;buttons.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('correct')});$('feedback').textContent='⭐ '+item.why;$('next').disabled=false;speak(item.why)}else{buttons[i].classList.add('wrong');$('feedback').textContent='💡 Tente novamente! Pense no que ajuda a criar ideias próprias.';speak('Tente novamente. Pense no que ajuda a criar ideias próprias.')}}
$('next').onclick=()=>{if(current===8){current=0;selected=[null,null,null];solved={}}else current++;render()};$('back').onclick=()=>{current=Math.max(0,current-1);render()};$('listen').onclick=()=>speak(textNow());$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'🎙️ Narração automática: sim':'🎙️ Narração automática: não';if(auto)speak(textNow())};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Reativar som':'🔈 Silenciar';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};render();
</script></body></html>
