let current=0, solved={},auto=false,muted=false;
const $=id=>document.getElementById(id);
function speak(t){if(muted||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.88;u.pitch=1.1;let voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('pt'));if(voices.length)u.voice=voices.find(v=>/pt-br|brazil|brasil/i.test(v.lang+' '+v.name))||voices[0];speechSynthesis.speak(u)}
function render(){
 if('speechSynthesis'in window)speechSynthesis.cancel();
 $('picture').src=data.images[current];$('counter').textContent=`Cena ${current+1} de 9`;
 $('dialog').textContent=data.lines[current];$('feedback').textContent='';
 $('back').disabled=current===0;$('next').textContent=current===8?'Jogar novamente ↻':current===0?'Começar →':'Próxima cena →';
 const q=data.quizScenes.indexOf(current);$('quiz').replaceChildren();
 if(q>=0){
  const title=document.createElement('strong');title.textContent=`Desafio ${q+1} de 3 — escolha a resposta:`;$('quiz').append(title);
  data.options[q].forEach((opt,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=`${String.fromCharCode(65+i)}. ${opt}`;b.onclick=()=>answer(q,i);if(solved[q]){b.disabled=true;if(i===data.correct[q])b.classList.add('correct')}$('quiz').append(b)});
  $('next').disabled=!solved[q];
  if(!solved[q])$('feedback').textContent='Escolha uma alternativa para continuar.';
 }else $('next').disabled=false;
 if(auto)speak(data.lines[current]);
}
function answer(q,i){
 if(solved[q])return;
 const btns=[...$('quiz').querySelectorAll('button')];
 if(i===data.correct[q]){
  solved[q]=true;btns.forEach((b,k)=>{b.disabled=true;if(k===i)b.classList.add('correct')});
  $('feedback').textContent='⭐ '+data.explanations[q];$('next').disabled=false;speak(data.explanations[q]);
 }else{btns[i].classList.add('wrong');$('feedback').textContent='💡 Ainda não. Leia as opções e tente outra vez!';speak('Ainda não. Leia as opções e tente outra vez!')}
}
$('next').onclick=()=>{if(current===8){current=0;solved={}}else current++;render()};
$('back').onclick=()=>{current=Math.max(0,current-1);render()};
$('listen').onclick=()=>speak(data.lines[current]);
$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'🎙️ Narração automática: sim':'🎙️ Narração automática: não';if(auto)speak(data.lines[current])};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Reativar som':'🔈 Silenciar';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};
render();
</script></body></html>
